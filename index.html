<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="编排操作台：自建圆桌会议与任务，并为任务选择执行器和模型。离线预览，不会自动派发。"
    />
    <title>编排操作台 · Operator Board</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("operator-board-theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "light" || t === "dark" ? t : "dark",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
